name: Sync spec to Google Sheet
on:
  push:
    branches: [main]
    paths: ['finance/docs/spec.md', 'finance/docs/rules.md', 'finance/docs/changelog.md']
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tsx scripts/sync-spec-to-sheet.ts
        env:
          SPEC_SHEET_ID: ${{ secrets.SPEC_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
